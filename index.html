<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Kompakte Cheatsheets für Linux, Windows, Netzwerk, Datenbanken, Container und mehr.">
  <title>Cheatsheets</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232557d6'/%3E%3Cpath d='M9 11l5 5-5 5M16 22h7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="assets/theme.js"></script>
  <link rel="stylesheet" href="assets/style.css">
  <script src="assets/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Zum Inhalt springen</a>

  <header class="topbar">
    <button type="button" class="icon-btn menu-btn" id="menu-toggle"
            aria-controls="sidebar" aria-expanded="false" aria-label="Navigation öffnen">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="./" data-home>Cheatsheets</a>
    <button type="button" class="icon-btn" id="theme-toggle" aria-label="Dunkles Farbschema aktivieren">
      <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
      <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Cheatsheets">
      <div class="sidebar-search">
        <label for="sheet-filter" class="visually-hidden">Cheatsheet suchen</label>
        <input type="search" id="sheet-filter" placeholder="Cheatsheet suchen …" autocomplete="off" spellcheck="false">
      </div>
      <div id="sheet-list"></div>
    </nav>

    <main id="content" tabindex="-1">
      <noscript>
        <p class="notice">Diese Seite benötigt JavaScript, um die Cheatsheets zu laden.</p>
      </noscript>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
